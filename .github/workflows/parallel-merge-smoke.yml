name: IRTree parallel merge smoke (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: irtree-results-writer
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify results branch and snapshot
        run: |
          set -euo pipefail
          git fetch origin results
          git ls-tree -r --name-only origin/results sim/results_core8 | grep -q 'rep_0001.rds'
          echo "SNAPSHOT_BRANCH_PASS"
  shards:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        condition: [C029, C030]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: false
      - name: System requirements
        run: sudo apt-get update && sudo apt-get install -y build-essential gfortran libblas-dev liblapack-dev libuv1-dev
      - name: Install pinned packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Rlib"
          Rscript R_env/install_pinned.R "$GITHUB_WORKSPACE/Rlib"
      - name: Compute one new replication in isolated shard
        working-directory: sim
        env:
          R_LIBS_USER: ${{ github.workspace }}/Rlib
          IRTREE_COND: ${{ matrix.condition }}
          IRTREE_REP_FROM: '10'
          IRTREE_REP_TO: '10'
          IRTREE_SEED_SCHEME: main
          IRTREE_ORACLE_DRAWS: '1'
          IRTREE_OUT: parallel_trial
          IRTREE_REQUIRE_FROZEN: '1'
        run: |
          Rscript main_sim.R
          Rscript -e 'x<-readRDS(file.path("parallel_trial",Sys.getenv("IRTREE_COND"),"rep_0010.rds")); stopifnot(is.data.frame(x$results),nrow(x$results)>0,all(x$results$status!="ERROR"),identical(x$meta$manifest_id,"ab03dffdf580"));cat("SHARD_PASS\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.condition }}
          path: sim/parallel_trial/
          if-no-files-found: error
          retention-days: 14
  merge:
    needs: shards
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: merged/
          merge-multiple: true
      - name: Verify isolated outputs and protected merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin results
          git switch -C results origin/results
          for cond in C029 C030; do
            src="merged/$cond/rep_0010.rds"
            dst="sim/results_core8/$cond/rep_0010.rds"
            test -s "$src"
            if [ -e "$dst" ]; then
              cmp -s "$src" "$dst" || { echo "::error::Existing conflicting result $dst. No overwrite."; exit 1; }
            else
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
            fi
          done
          git add -f sim/results_core8/C029/rep_0010.rds sim/results_core8/C030/rep_0010.rds
          if ! git diff --cached --quiet; then
            git commit -m "Smoke test parallel result merge C029/C030 rep 10"
            git push origin results
          fi
          echo "PARALLEL_MERGE_PASS"
