name: Audit Claude-GitHub two overlapping replications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
      - name: Compare statistical results inside RDS files
        run: |
          set -euo pipefail
          git fetch origin results
          mkdir -p audit
          git archive --format=tar origin/results sim/results_core8/C029/rep_0010.rds sim/results_core8/C030/rep_0010.rds | tar -xf -
          python3 - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile("IRTree_core8_backup_final_20261017_0109.zip")
          for c in ("C029","C030"):
            data=z.read("backup_final_20261017_0109/results_core8/"+c+"/rep_0010.rds")
            pathlib.Path("audit/claude_"+c+".rds").write_bytes(data)
          PY
          Rscript - <<'RS' | tee audit/scientific_comparison.txt
          options(digits=16)
          clean <- function(x) {
            if (is.data.frame(x)) {
              x <- x[, setdiff(names(x), c("host","time","wall_seconds","screen_seconds")), drop=FALSE]
              rownames(x) <- NULL
              return(x)
            }
            if (is.list(x)) return(lapply(x, clean))
            x
          }
          good <- TRUE
          for (cnd in c("C029","C030")) {
            gh <- readRDS(sprintf("sim/results_core8/%s/rep_0010.rds",cnd))
            cl <- readRDS(sprintf("audit/claude_%s.rds",cnd))
            cat("\n=== ",cnd," repetition 10 ===\n",sep="")
            cat("GH metadata:\n");print(gh$meta)
            cat("Claude metadata:\n");print(cl$meta)
            for (field in c("results","nodes","anchors","links","issues")) {
              a <- clean(gh[[field]]); b <- clean(cl[[field]])
              eq <- isTRUE(all.equal(a,b,tolerance=1e-8,check.attributes=FALSE))
              cat(field,"EQUAL within tolerance 1e-8:",eq,"\n")
              if (!eq) {
                good <- FALSE
                cat("First differences:\n")
                print(utils::head(capture.output(all.equal(a,b,tolerance=1e-8,check.attributes=FALSE)),12))
              }
            }
            meta_equal <- isTRUE(all.equal(clean(gh$meta),clean(cl$meta),tolerance=1e-8,check.attributes=FALSE))
            cat("METADATA excluding timing/host EQUAL:",meta_equal,"\n")
            if (!meta_equal) print(utils::head(capture.output(all.equal(clean(gh$meta),clean(cl$meta),tolerance=1e-8,check.attributes=FALSE)),12))
          }
          cat("\nSTATISTICAL_AUDIT_PASS:", good, "\n")
          if (!good) quit(status=2)
          RS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlap-scientific-audit
          path: audit/scientific_comparison.txt
          retention-days: 30
          if-no-files-found: ignore
