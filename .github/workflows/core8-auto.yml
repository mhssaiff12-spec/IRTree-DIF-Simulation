name: IRTree core8 automatic missing-replications
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
concurrency:
  group: irtree-results-writer
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-22.04
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        condition: [C029, C030, C031, C032, C047, C050, C053, C056]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load existing results and choose the next three missing replications
        id: plan
        env:
          COND: ${{ matrix.condition }}
        run: |
          set -euo pipefail
          git fetch origin results
          mkdir -p "sim/results_core8/$COND"
          git archive --format=tar origin/results "sim/results_core8/$COND" | tar -xf -
          python3 - <<'PY'
          import os,pathlib
          c=os.environ["COND"]; folder=pathlib.Path("sim/results_core8")/c
          missing=[n for n in range(1,201) if not (folder/f"rep_{n:04d}.rds").exists()]
          print(f"{c}: complete={200-len(missing)} missing={len(missing)}")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
            f.write("remaining="+str(len(missing))+"\n")
            f.write("run="+str(bool(missing)).lower()+"\n")
            if missing:
              selected=missing[:3]
              f.write(f"first={min(selected)}\nlast={max(selected)}\n")
              print("NEXT",selected)
          PY
      - uses: r-lib/actions/setup-r@v2
        if: steps.plan.outputs.run == 'true'
        with:
          r-version: "4.3.3"
          use-public-rspm: false
      - name: System packages
        if: steps.plan.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential gfortran libblas-dev liblapack-dev libuv1-dev
      - name: Install pinned packages
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/Rlib"
          Rscript R_env/install_pinned.R "$GITHUB_WORKSPACE/Rlib"
      - name: Compute missing replications and validate them
        if: steps.plan.outputs.run == 'true'
        working-directory: sim
        env:
          R_LIBS_USER: ${{ github.workspace }}/Rlib
          IRTREE_COND: ${{ matrix.condition }}
          IRTREE_REP_FROM: ${{ steps.plan.outputs.first }}
          IRTREE_REP_TO: ${{ steps.plan.outputs.last }}
          IRTREE_SEED_SCHEME: main
          IRTREE_ORACLE_DRAWS: "1"
          IRTREE_REQUIRE_FROZEN: "1"
          IRTREE_OUT: results_core8
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          Rscript main_sim.R
          Rscript - <<'RS'
          cnd <- Sys.getenv("IRTREE_COND")
          a <- as.integer(Sys.getenv("IRTREE_REP_FROM"))
          b <- as.integer(Sys.getenv("IRTREE_REP_TO"))
          for (r in a:b) {
            f <- sprintf("results_core8/%s/rep_%04d.rds",cnd,r)
            stopifnot(file.exists(f))
            x <- readRDS(f)
            stopifnot(nrow(x$meta)==1, x$meta$rep[1]==r,
                x$meta$condition_id[1]==cnd,
                identical(x$meta$manifest_id[1],"ab03dffdf580"),
                !is.null(x$results), nrow(x$results)>=4,
                !any(is.na(x$results$status)), all(x$results$status!="ERROR"))
          }
          cat("AUTO_BATCH_VERIFIED",cnd,a,b,"\n")
          RS
      - name: Package chosen range
        if: steps.plan.outputs.run == 'true'
        working-directory: sim
        env:
          COND: ${{ matrix.condition }}
          FROM: ${{ steps.plan.outputs.first }}
          TO: ${{ steps.plan.outputs.last }}
        run: |
          set -euo pipefail
          mkdir -p "auto_upload/$COND"
          for (( r=10#$FROM; r<=10#$TO; r++ )); do
            cp "results_core8/$COND/$(printf 'rep_%04d.rds' "$r")" "auto_upload/$COND/"
          done
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.run == 'true'
        with:
          name: automatic-${{ matrix.condition }}
          path: sim/auto_upload/
          if-no-files-found: error
          retention-days: 14

  merge:
    needs: compute
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: automatic-*
          path: incoming/
          merge-multiple: true
        continue-on-error: true
      - name: Merge without overwriting and report completion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin results
          git switch -C results origin/results
          count=0
          if [ -d incoming ]; then
            while IFS= read -r -d '' src; do
              rel="${src#incoming/}"
              dst="sim/results_core8/$rel"
              if [ -e "$dst" ]; then
                cmp -s "$src" "$dst" || { echo "::error::Conflicting RDS file $rel"; exit 1; }
              else
                mkdir -p "$(dirname "$dst")"
                cp "$src" "$dst"
                count=$((count+1))
              fi
            done < <(find incoming -name 'rep_*.rds' -print0)
          fi
          git add -f sim/results_core8
          if ! git diff --cached --quiet; then
            git commit -m "Automatic core8 missing-replication batch"
            git push origin results
          fi
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import pathlib
          cs=["C029","C030","C031","C032","C047","C050","C053","C056"]
          total=0
          print("## Core8 completion report")
          print("| Condition | Completed | Missing |")
          print("|---|---:|---:|")
          for c in cs:
            d=pathlib.Path("sim/results_core8")/c
            n=sum((d/f"rep_{i:04d}.rds").exists() for i in range(1,201))
            total+=n
            print(f"| {c} | {n} | {200-n} |")
          print(f"\n**Total: {total}/1600; remaining: {1600-total}.**")
          if total==1600: print("\n**CORE8_COMPLETE: all replication files present.**")
          PY
          echo "AUTO_BATCH_MERGE_PASS new=$count"
